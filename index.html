            { id: 107, cat: "grammar", q: "The flat, ...... the sea, costs much.", opts: ["a. that overlook", "b. which overlook", "c. overlooks", "d. overlooking"], ans: 3 },
            { id: 108, cat: "grammar", q: "She is the most intelligent girl ...... I have ever seen.", opts: ["a. who's", "b. to whom", "c. that", "d. whose"], ans: 2 },
            { id: 109, cat: "grammar", q: "Most of the novels ...... by Taha Hussein were translated into different languages.", opts: ["a. written", "b. which written", "c. writing", "d. were written"], ans: 0 },

            { id: 111, cat: "grammar", q: "The city, ...... my aunt lives in, is so far away.", opts: ["a. which", "b. who", "c. where", "d. when"], ans: 0 },
            { id: 112, cat: "grammar", q: "The tourists ...... stay in Egypt was wonderful decided to come back again.", opts: ["a. who", "b. which", "c. where", "d. whose"], ans: 3 },
            { id: 113, cat: "grammar", q: "I don't know the person with ...... I was chatting.", opts: ["a. who", "b. which", "c. that", "d. whom"], ans: 3 }
        ];

        // App State
        let userAnswers = {};
        let currentFilter = 'all';
        let isSubmitted = false;

        // Dark/Light Theme toggle
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            themeToggleDarkIcon.classList.remove('hidden');
        }

        document.getElementById('theme-toggle').addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });

        // Initialize App
        function initApp() {
            document.getElementById('total-questions').innerText = allQuestions.length;
            document.getElementById('count-all').innerText = allQuestions.length;
            renderQuestions();
            updateProgress();
        }

        // Render Questions
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            const filtered = allQuestions.filter(q => currentFilter === 'all' || q.cat === currentFilter);

            filtered.forEach(q => {
                const card = document.createElement('div');
                card.className = "question-card bg-white dark:bg-slate-800 p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 transition duration-200";
                card.id = `q-card-${q.id}`;

                let selectedIndex = userAnswers[q.id];

                let optsHtml = q.opts.map((opt, optIdx) => {
                    let optStyle = "border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 hover:border-brand-500 text-slate-700 dark:text-slate-300";
                    let badge = "";

                    if (selectedIndex === optIdx) {
                        optStyle = "border-brand-500 bg-brand-50 dark:bg-brand-950/40 text-brand-700 dark:text-brand-300 font-semibold ring-1 ring-brand-500";
                    }

                    if (isSubmitted) {
                        if (optIdx === q.ans) {
                            optStyle = "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 font-bold ring-2 ring-emerald-500";
                            badge = `<span class="mr-auto bg-emerald-500 text-white text-xs px-2 py-0.5 rounded-full"><i class="fa-solid fa-check"></i> الصحيحة</span>`;
                        } else if (selectedIndex === optIdx && selectedIndex !== q.ans) {
                            optStyle = "border-rose-500 bg-rose-50 dark:bg-rose-950/50 text-rose-700 dark:text-rose-300 font-bold ring-2 ring-rose-500";
                            badge = `<span class="mr-auto bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full"><i class="fa-solid fa-xmark"></i> خطأ</span>`;
                        }
                    }

                    return `
                        <button onclick="selectOption(${q.id}, ${optIdx})" 
                                ${isSubmitted ? 'disabled' : ''} 
                                class="w-full text-right p-3.5 rounded-xl border text-sm md:text-base flex items-center transition-all duration-150 ${optStyle} direction-ltr">
                            <span class="inline-block font-sans">${opt}</span>
                            ${badge}
                        </button>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3 mb-4">
                        <span class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600">
                            سؤال #${q.id}
                        </span>
                        <span class="text-xs font-semibold ${q.cat === 'vocab' ? 'text-blue-500' : 'text-purple-500'}">
                            ${q.cat === 'vocab' ? 'Vocabulary' : 'Grammar'}
                        </span>
                    </div>
                    <div class="question-text text-slate-900 dark:text-slate-100 font-semibold text-base md:text-lg mb-4 direction-ltr leading-relaxed">
                        ${q.q}
                    </div>
                    <div class="space-y-2.5">
                        ${optsHtml}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Option selection
        function selectOption(qId, optIdx) {
            if (isSubmitted) return;
            userAnswers[qId] = optIdx;
            updateProgress();
            renderQuestions();
        }

        // Progress update
        function updateProgress() {
            const answeredCount = Object.keys(userAnswers).length;
            const totalCount = allQuestions.length;
            document.getElementById('answered-count').innerText = answeredCount;
            
            const percentage = (answeredCount / totalCount) * 100;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        // Filter Questions
        function filterQuestions(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-brand-600', 'text-white');
                btn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');
            });

            const activeBtn = document.getElementById(`filter-${category}`);
            activeBtn.classList.add('active', 'bg-brand-600', 'text-white');
            activeBtn.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');

            renderQuestions();
        }

        // Submit Quiz
        function submitQuiz() {
            isSubmitted = true;
            let correct = 0;

            allQuestions.forEach(q => {
                if (userAnswers[q.id] === q.ans) {
                    correct++;
                }
            });

            const total = allQuestions.length;
            const percentage = Math.round((correct / total) * 100);

            document.getElementById('final-score').innerText = `${correct} / ${total}`;
            document.getElementById('correct-count').innerText = correct;
            document.getElementById('percentage').innerText = `${percentage}%`;

            document.getElementById('result-modal').classList.remove('hidden');
            renderQuestions();

            document.getElementById('result-modal').scrollIntoView({ behavior: 'smooth' });
        }

        // Reset Quiz
        function resetQuiz() {
            userAnswers = {};
            isSubmitted = false;
            document.getElementById('result-modal').classList.add('hidden');
            updateProgress();
            renderQuestions();
        }

        // Scroll to top
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Run on load
        window.onload = initApp;
    </script>
</body>
